<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3b40">
<title>Üretim Takip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230f3b40%27/%3E%3Cpath d=%27M18 34l9 9 19-21%27 fill=%27none%27 stroke=%27%237ddba6%27 stroke-width=%277%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root{--brand:#0f3b40;--brand2:#1d5a60;--bg:#f3f2ef;--card:#fff;--ink:#1f2324;--mute:#6e7476;--line:#e3e1dc;--prep:#2f6fb3;--ship:#2e8b57;--warn:#c26a12;--bad:#b33;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header small{display:block;font-weight:400;opacity:.75;font-size:12px}
.sync{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.16);white-space:nowrap}
.sync.ok{background:#2e8b57}.sync.pending{background:#d98a1c}.sync.offline{background:#6e7476}.sync.err{background:#b33}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(160px + env(safe-area-inset-bottom))}
section.page{display:none}section.page.on{display:block}
h2{font-size:14px;color:var(--mute);margin:18px 4px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:10px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.small{font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--brand2)}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 2px 6px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-size:17px;font-weight:700;margin-top:14px}
.btn.sec{background:#e7ecec;color:var(--brand)}
.btn.sm{padding:11px;font-size:15px;margin-top:8px}
.btn.danger{background:#f8e7e7;color:var(--bad)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
/* Günlük tur */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input{flex:1;padding:10px 12px;font-size:16px}
.seg{display:flex;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:none;border-radius:10px;background:none;font:inherit;font-size:16px;font-weight:700;color:var(--mute);padding:11px 4px}
.seg button.onP{background:#e5eef8;color:var(--prep)}
.seg button.onS{background:#e3f3ea;color:var(--ship)}
.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.oh b{font-size:16px}.oh .no{color:var(--mute);font-weight:500;font-size:14px}
.oh .pc{text-align:right;font-size:12.5px;line-height:1.45;white-space:nowrap}
.pcP{color:var(--prep);font-weight:800;font-size:14.5px}.pcS{color:var(--ship);font-weight:700}
.crow{padding:10px 0;border-top:1px solid var(--line)}
.crow:first-of-type{margin-top:8px}
.cl{display:flex;align-items:center;gap:10px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18);display:inline-block}
.cn{flex:1;min-width:0}
.cn .t{display:flex;justify-content:space-between;gap:6px;font-size:15px}
.cn .t span:last-child{color:var(--mute);font-size:14px;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:#ecebe7;overflow:hidden;margin-top:6px;display:flex}
.bar span{display:block;height:100%}
.meta{font-size:12.5px;color:var(--mute);margin:6px 0 0 26px;display:flex;flex-wrap:wrap;gap:2px 10px}
.meta .fz{color:var(--warn);font-weight:700}
.meta .td{color:var(--brand2);font-weight:700}
.st{display:flex;align-items:center;gap:4px;flex:none}
.st button{width:40px;height:40px;border:none;border-radius:11px;background:#eef0f0;color:var(--brand);font-size:22px;font-weight:700;padding:0}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.st input{width:50px;height:40px;padding:0;text-align:center;font-size:17px;font-weight:800;border-radius:10px;color:var(--mute)}
.st input.hasP{color:var(--prep);border-color:var(--prep);background:#f2f7fc}
.st input.hasS{color:var(--ship);border-color:var(--ship);background:#f1f9f4}
.done{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e3f3ea;color:var(--ship)}
.legend{display:flex;justify-content:center;gap:16px;font-size:12.5px;color:var(--mute);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:7;padding:8px 12px;display:none}
.savebar.on{display:block}
.savebar .in{max-width:640px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.savebar .in div{flex:1;font-size:14px;line-height:1.35}
.savebar button{border:none;border-radius:12px;font:inherit;font-weight:800;font-size:16px;padding:12px 16px}
.savebar .ok{background:#fff;color:var(--ink)}
.savebar .x{background:rgba(255,255,255,.15);color:#fff;padding:12px}
/* Liste satırları */
.mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:none}
.mv .tx{flex:1;min-width:0}
.mv .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .q{font-weight:800;font-size:17px;white-space:nowrap}
.mv .del{border:none;background:#f8e7e7;color:var(--bad);font-size:17px;width:40px;height:40px;border-radius:10px;flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.tag.P{background:#e5eef8;color:var(--prep)}.tag.S{background:#e3f3ea;color:var(--ship)}
.dayh{font-size:13px;font-weight:800;color:var(--brand);margin:14px 4px 4px}
details.arch{margin-top:18px}
details.arch summary{font-size:14px;color:var(--mute);font-weight:700;padding:12px 4px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.card.delpend{border:2px dashed var(--bad);background:#fdf3f3}
.delinfo{margin-top:10px;font-size:14px;font-weight:700;color:var(--bad)}
/* Sayfalar alt menü */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:none;background:none;padding:9px 2px 8px;font:inherit;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand);font-weight:700}
/* Alt pencere */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;color:var(--brand)}
.ocard{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:22px;border:1.5px solid #c9d6d6;box-shadow:0 3px 10px rgba(15,59,64,.08)}
.ocard.delpend{border:2px dashed var(--bad)}
.ohd{display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:12px 14px;cursor:pointer;user-select:none}
.ohd .l{flex:1;min-width:0}
.ohd .cu{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohd .nob{display:inline-block;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 9px;margin-left:4px;vertical-align:2px}
.ohd .sub{font-size:12.5px;color:#a9cfd2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohd .ring{flex:none;display:flex;align-items:center;gap:8px}
.ohd .ring div{font-size:12.5px;line-height:1.4;text-align:right;white-space:nowrap}
.ohd .ring b.p{color:#8cc2f5}.ohd .ring b.s{color:#7ddba6}
.ohd .chev{flex:none;font-size:20px;color:#a9cfd2;transition:transform .2s}
.ocard.closed .chev{transform:rotate(-90deg)}
.ocard.closed .obody{display:none}
.hbar{height:6px;background:#dfe5e5;display:flex}.hbar span{display:block;height:100%}
.obody{padding:2px 14px 14px}
.obody>.ph:first-child{margin-top:12px}
.opend{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;background:#fff;color:var(--brand);border-radius:999px;padding:1px 8px;vertical-align:2px}
.bkb{background:#fff7e6;border:1.5px solid #f0c674;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.bkb b{color:#8a5a00}.bkb p{margin:4px 0 0;font-size:14px;color:#6b5a3a}
.bkb .btns .btn{margin-top:10px}
.bkr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.bkr div{flex:1;min-width:0}.bkr small{color:var(--mute)}
.bkr button{border:none;border-radius:10px;background:#eef0f0;color:var(--brand);font:inherit;font-size:13px;font-weight:700;padding:9px 10px;flex:none}
.ph{display:flex;justify-content:space-between;align-items:center;margin:12px 0 0;padding:7px 10px;background:#eef3f3;border-radius:10px;font-size:14px;font-weight:800;color:var(--brand)}
.ph span{font-weight:600;color:var(--mute);font-size:13px}
.ph+.crow{border-top:none}
.pcard{border:1.5px solid var(--line);box-shadow:none;margin:0 0 10px;padding:10px 12px}
.pn{display:flex;gap:8px;align-items:center}
.pn input{font-weight:700}
.pn button{border:none;background:#f8e7e7;color:var(--bad);width:44px;height:46px;border-radius:12px;font-size:18px;flex:none}
.oc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.oc .nm{flex:1;font-weight:600}
.oc input{width:96px;text-align:center;font-weight:800;padding:10px}
.oc button{border:none;background:#f8e7e7;color:var(--bad);width:38px;height:38px;border-radius:10px;font-size:18px;flex:none}
.pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.pal button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 2px;font:inherit;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);line-height:1.2}
.pal button .dot{width:30px;height:30px}
.pal button.used{opacity:.35}
.newc{display:flex;gap:8px;align-items:center;margin-top:8px}
.newc input[type=color]{width:56px;height:48px;padding:4px;flex:none}
.sheet.dlg{align-items:center;z-index:35;padding:20px}
.sheet.dlg .box{border-radius:20px;max-width:420px}
#dlgMsg{font-size:17px;line-height:1.5;white-space:pre-line;margin:4px 2px 0}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#repPreview{width:100%;border-radius:10px;border:1px solid var(--line);display:none;margin-top:12px;background:#fff}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:100%;max-width:380px}.login h2{color:var(--brand);font-size:28px;text-transform:none;letter-spacing:0;margin:0 0 4px}
.login input{margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Üretim Takip<small>Hazırlık ve sevkiyat · çuval</small></h1>
  <span class="sync" id="syncChip" style="display:none"></span>
</header>

<main>
  <!-- GÜNLÜK TUR -->
  <section class="page on" id="p-tur">
    <div id="bkBanner"></div>
    <div class="toolbar">
      <span class="small">📅 Tarih</span>
      <input type="date" id="tDate">
    </div>
    <div class="seg">
      <button id="mP" onclick="setMode('P')">📦 Hazırlandı</button>
      <button id="mS" onclick="setMode('S')">🚚 Sevk edildi</button>
    </div>
    <div id="turList"></div>
    <div class="legend" id="turLegend"><span><i style="background:var(--ship)"></i>Sevk edildi</span><span><i style="background:var(--prep)"></i>Depoda hazır</span></div>
  </section>

  <!-- SİPARİŞLER -->
  <section class="page" id="p-orders">
    <button class="btn" style="margin-top:0" onclick="openOrder()">＋ Yeni sipariş</button>
    <h2>Açık siparişler</h2>
    <div id="orderList"></div>
    <details class="arch">
      <summary>Arşiv (<span id="archCount">0</span>)</summary>
      <div id="archList"></div>
    </details>
    <h2>Yedekleme</h2>
    <div class="card">
      <div id="bkInfo" class="small" style="line-height:1.6"></div>
      <button class="btn sm" onclick="shareNow()">📤 Yedeği WhatsApp'a gönder</button>
      <button class="btn sec sm" onclick="$('bkFile').click()">📥 Yedek dosyasından geri yükle</button>
      <input type="file" id="bkFile" accept=".txt,.json,text/plain,application/json" style="display:none">
      <details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:700;padding:6px 0">Telefondaki otomatik yedekler (<span id="bkCount">0</span>)</summary><div id="bkList"></div></details>
    </div>
    <h2>Hesap</h2>
    <div class="card">
      <p class="small" style="margin:0" id="acctLine">Yerel mod (bulut bağlı değil)</p>
      <button class="btn sec sm" id="logoutBtn" style="display:none">Çıkış yap</button>
    </div>
  </section>

  <!-- GEÇMİŞ -->
  <section class="page" id="p-hist">
    <div class="row2">
      <select id="hOrder"></select>
      <select id="hType"><option value="">Tüm işlemler</option><option value="P">Hazırlandı</option><option value="S">Sevk edildi</option></select>
    </div>
    <div id="histList"></div>
  </section>

  <!-- RAPOR -->
  <section class="page" id="p-rep">
    <div class="card">
      <label class="f" style="margin-top:0">Sipariş</label>
      <select id="rOrder"></select>
      <button class="btn" id="shareBtn" style="display:none">Raporu paylaş</button>
      <img id="repPreview" alt="Rapor">
    </div>
  </section>
</main>

<div class="savebar" id="saveBar"><div class="in">
  <div id="saveInfo"></div>
  <button class="x" onclick="clearPend()" aria-label="Temizle">✕</button>
  <button class="ok" onclick="savePend()">Kaydet</button>
</div></div>

<nav class="tabbar" id="tabbar">
  <button data-p="tur" class="on"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Günlük tur</span></button>
  <button data-p="orders"><svg viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg><span>Siparişler</span></button>
  <button data-p="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Geçmiş</span></button>
  <button data-p="rep"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span>Rapor</span></button>
</nav>

<!-- Sipariş ekle / düzenle -->
<div class="sheet" id="orderSheet" onclick="if(event.target===this)closeSheet('orderSheet')">
  <div class="box">
    <h3 id="osTitle">Yeni sipariş</h3>
    <label class="f">Müşteri</label>
    <input id="oCustomer" autocomplete="off" list="custList"><datalist id="custList"></datalist>
    <div class="row2">
      <div><label class="f">Sipariş no</label><input id="oNo" autocomplete="off"></div>
      <div><label class="f">Sipariş tarihi</label><input id="oDate" type="date"></div>
    </div>
    <label class="f">Ürünler, renkler ve çuval adedi</label>
    <datalist id="prodList"></datalist>
    <div id="oProds"></div>
    <button class="btn sec sm" style="margin-top:0" onclick="addProd()">＋ Ürün ekle</button>
    <button class="btn" onclick="saveOrder()">Kaydet</button>
    <button class="btn sec" onclick="closeSheet('orderSheet')">Vazgeç</button>
  </div>
</div>

<!-- Renk seç -->
<div class="sheet" id="palSheet" onclick="if(event.target===this)closeSheet('palSheet')">
  <div class="box">
    <h3>Renk seç</h3>
    <div class="pal" id="palGrid"></div>
    <label class="f">Listede olmayan yeni renk</label>
    <div class="newc"><input id="ncName" placeholder="Renk adı"><input id="ncHex" type="color" value="#888888"></div>
    <button class="btn sec sm" onclick="addCustomColor()">Yeni rengi listeye ekle</button>
    <button class="btn sec" onclick="closeSheet('palSheet')">Kapat</button>
  </div>
</div>

<div class="login" id="loginBox" style="display:none">
  <div class="box">
    <h2>Üretim Takip</h2>
    <p class="small">Astar Takip ile aynı hesapla giriş yapın.</p>
    <input id="lgEmail" type="email" placeholder="E-posta" autocomplete="username">
    <input id="lgPass" type="password" placeholder="Şifre" autocomplete="current-password">
    <button class="btn" id="lgBtn">Giriş yap</button>
    <p class="small" id="lgErr" style="color:#b33"></p>
  </div>
</div>
<div class="sheet dlg" id="dlg"><div class="box">
  <p id="dlgMsg"></p>
  <div class="btns"><button class="btn sec" id="dlgNo">Vazgeç</button><button class="btn" id="dlgYes">Evet</button></div>
</div></div>
<div id="toast"></div>

<script>
/* ================= HAZIR RENK LİSTESİ ================= */
const PALETTE = [
 ['Özbek bordo','#5e1a1d'],['Afgan bordo','#b3262e'],['Maroon','#6b1f2a'],
 ['Petrol','#2f6fb3'],['Koyu petrol','#0f3b40'],
 ['Fıstık yeşil','#8db04a'],['Zümrüt','#0f7a4f'],['Nefti','#1c3322'],
 ['Krem','#ecdfc2'],['Sarı bej','#d6bb7f'],['Ivory','#fcf9ef'],['Kemik','#e0d6c2'],
 ['Silky','#e09a12'],['Şeker AYM','#b8862b'],['Şeker LT','#f2e5bd'],
 ['Koyu kahve','#24140b'],['Vizon','#a8825f'],
 ['Açık gri','#b9bbbe'],['Past grey','#d4d7d8'],['SP grey','#535d55'],['Koyu gri','#4f4f4f'],
 ['Siyah','#1b1b1b'],['Altın','#c9a227']
];

/* ================= VERİ =================
   Bulutta: users/{uid}/u_orders, u_moves, u_meta (Astar Takip verilerinden ayrı) */
const LKEY='uretim-takip-v1';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S=(()=>{try{const d=JSON.parse(LS.get(LKEY));if(d&&d.orders)return d;}catch(e){}return {orders:[],moves:[],meta:{colors:[]}};})();
function saveLocal(){ LS.set(LKEY,JSON.stringify(S)); }
function applyOps(ops){ // ops: [['put',coll,obj]|['del',coll,id]]
  ops.forEach(([op,coll,v])=>{
    if(coll==='meta'){ if(op==='put') S.meta=v; return; }
    const arr=S[coll], id=op==='put'?v.id:v, i=arr.findIndex(x=>x.id===id);
    if(op==='put'){ if(i>=0) arr[i]=v; else arr.push(v); } else if(i>=0) arr.splice(i,1);
  });
}

/* Hesap: her renk için hazırlanan / sevk / depoda / kalan */
function calcColor(oid,cid,extraP=0,extraS=0){
  const o=orderById(oid), c=colorOf(o,cid); let r=0,s=0;
  S.moves.forEach(m=>{ if(m.orderId===oid&&m.colorId===cid){ if(m.type==='P') r+=m.qty; else s+=m.qty; } });
  r+=extraP; s+=extraS; const q=c?c.qty:0;
  return {q,r,s,dep:r-s,kal:Math.max(0,q-r),fz:Math.max(0,r-q)};
}
function calcOrder(oid,withPend){
  const o=orderById(oid), T={q:0,r:0,s:0,dep:0,kal:0,fz:0,rc:0};
  o.colors.forEach(c=>{ const x=calcColor(oid,c.id,withPend?pv('P',oid,c.id):0,withPend?pv('S',oid,c.id):0);
    for(const k in x) T[k]+=x[k]; T.rc+=Math.min(x.r,x.q); });

}

function autoBackup(force){
  if(cloudWaiting()||!hasData()) return;
  const l=bkList(), last=l.length?l[l.length-1].ts:0;
  if(!force&&Date.now()-last<BK_EVERY) return;
  l.push(snapshot()); bkStore(prune(l)); renderBk(); renderBkBanner();
}
setTimeout(()=>autoBackup(),2500);
setInterval(()=>autoBackup(),5*60*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ autoBackup(); renderBkBanner(); } });
const bkName=ts=>{ const d=new Date(ts); return 'uretim-yedek-'+isoOf(d)+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.txt'; };
const bkCounts=b=>`${(b.orders||[]).filter(o=>!o.archived).length} açık sipariş · ${(b.moves||[]).length} kayıt`;
async function shareBackup(b){
  // Not: Android paylaşımı .json dosyasını kabul etmiyor, bu yüzden yedek .txt olarak gönderiliyor (içi yine JSON).
  const name=bkName(b.ts), blob=new Blob([JSON.stringify(b)],{type:'text/plain'}), f=new File([blob],name,{type:'text/plain'});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Üretim Takip yedeği'}); markShared(); return; } }
  catch(e){ if(e.name==='AbortError') return; }
  download(blob,name); markShared(); note('Bu tarayıcı dosya paylaşımını desteklemiyor. Yedek dosyası telefona indirildi; WhatsApp\'tan "Belge" olarak gönderebilirsiniz.');
}
function markShared(){ LS.set(BKS,today()); LS.set(BKS+'-ts',String(Date.now())); renderBk(); renderBkBanner(); toast('Yedek gönderildi ✓'); }
function shareNow(){ if(!hasData()) return toast('Henüz yedeklenecek veri yok'); autoBackup(true); const l=bkList(); shareBackup(l[l.length-1]); }
function renderBkBanner(){
  const el=$('bkBanner'); if(!el) return;
  if(!hasData()||cloudWaiting()||bkLater||LS.get(BKS)===today()){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="bkb"><b>📤 Günlük yedek</b><p>Bugünün yedeği henüz WhatsApp'a gönderilmedi.</p>
    <div class="btns"><button class="btn sec sm" onclick="bkLater=true;renderBkBanner()">Sonra</button><button class="btn sm" onclick="shareNow()">Şimdi gönder</button></div></div>`;
}
function renderBk(){
  if(!$('bkInfo')) return; const l=bkList(), last=l[l.length-1], sts=+LS.get(BKS+'-ts')||0;
  $('bkInfo').innerHTML=`🕑 Otomatik yedek: her 2 saatte bir, bu telefonda.<br>Son otomatik yedek: <b>${last?fmtTs(last.ts):'henüz yok'}</b><br>📤 Son WhatsApp gönderimi: <b>${sts?fmtTs(sts):'henüz yok'}</b>`;
  $('bkCount').textContent=l.length;
  $('bkList').innerHTML=l.length?l.slice().reverse().map(b=>`<div class="bkr"><div><b>${fmtTs(b.ts)}</b><br><small>${bkCounts(b)}</small></div>
    <button onclick="shareBackup(bkList().find(x=>x.ts===${b.ts}))">📤</button><button onclick="restoreBk(bkList().find(x=>x.ts===${b.ts}))">Geri yükle</button></div>`).join(''):`<p class="small">Henüz yedek yok</p>`;
}
async function restoreBk(b){
  if(!b||!Array.isArray(b.orders)||!Array.isArray(b.moves)) return note('Bu dosya geçerli bir Üretim Takip yedeği değil.');
  if(!await ask(`Bu yedek geri yüklensin mi?\n\n${fmtTs(b.ts||Date.now())}\n${bkCounts(b)}\n\nŞu anki veriler bu yedekteki verilerle değiştirilecek. (Önce şu anki hâlin yedeği alınır.)`)) return;
  autoBackup(true);
  const keepO=new Set(b.orders.map(o=>o.id)), keepM=new Set(b.moves.map(m=>m.id));
  const ops=[...S.orders.filter(o=>!keepO.has(o.id)).map(o=>['del','orders',o.id]),...S.moves.filter(m=>!keepM.has(m.id)).map(m=>['del','moves',m.id]),
    ...b.orders.map(o=>['put','orders',o]),...b.moves.map(m=>['put','moves',m]),['put','meta',b.meta||{colors:[]}]];
  pend.P={}; pend.S={}; DB.write(ops); toast('Yedek geri yüklendi ✓');
}
$('bkFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ restoreBk(JSON.parse(r.result)); }catch(err){ note('Dosya okunamadı. Doğru yedek dosyasını seçin.'); } }; r.readAsText(f); e.target.value=''; };

/* ================= GEÇMİŞ ================= */
function renderHist(){
  const ho=$('hOrder'), po=ho.value, l=act();
  ho.innerHTML=`<option value="">Tüm siparişler</option>`+l.map(o=>`<option value="${o.id}">${esc(oLabel(o))}</option>`).join('');
  ho.value=l.find(o=>o.id===po)?po:'';
  const live=new Set(l.map(o=>o.id)), ty=$('hType').value;
  const list=S.moves.filter(m=>live.has(m.orderId)&&(!ho.value||m.orderId===ho.value)&&(!ty||m.type===ty)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(!list.length){ $('histList').innerHTML=`<div class="card empty">Henüz kayıt yok</div>`; return; }
  let html='',day=null;
  list.forEach(m=>{ const o=orderById(m.orderId), c=colorOf(o,m.colorId)||{name:'?',hex:'#ccc'};
    if(m.date!==day){ if(day) html+='</div>'; day=m.date;
      let p=0,s=0; list.forEach(x=>{ if(x.date===day){ if(x.type==='P') p+=x.qty; else s+=x.qty; } });
      html+=`<div class="dayh">${fmtD(day)} <span class="small" style="font-weight:600">· ${p?p+' hazır':''}${p&&s?' · ':''}${s?s+' sevk':''}</span></div><div class="card">`; }
    html+=`<div class="mv"><span class="dot" style="background:${c.hex}"></span>
      <div class="tx"><div><b>${esc(cLabel(o,c))}</b> · ${esc(oLabel(o))}</div><small class="small"><span class="tag ${m.type}">${m.type==='P'?'Hazırlandı':'Sevk edildi'}</span> 🕒 ${fmtTs(m.ts)}</small></div>
      <span class="q" style="color:${m.type==='P'?'var(--prep)':'var(--ship)'}">${m.type==='P'?'+':'🚚 '}${m.qty}</span>
      <button class="del" onclick="delMove('${m.id}')" aria-label="sil">🗑</button></div>`; });
  $('histList').innerHTML=html+'</div>';
}
$('hOrder').onchange=$('hType').onchange=renderHist;
async function delMove(id){
  const m=S.moves.find(x=>x.id===id); if(!m) return; const o=orderById(m.orderId), c=colorOf(o,m.colorId)||{name:'?'};
  if(m.type==='P'){ const x=calcColor(m.orderId,m.colorId,-m.qty,0); if(x.dep<0) return note(`Bu kayıt silinemez: ${cLabel(o,c)} için sevk edilen (${x.s}), hazırlanandan (${x.r}) fazla olur. Önce ilgili sevk kaydını silin.`); }
  if(!await ask(`Silinsin mi?\n${fmtD(m.date)} · ${cLabel(o,c)} · ${m.type==='P'?'Hazırlandı':'Sevk edildi'} ${m.qty} çuval`)) return;
  DB.write([['del','moves',id]]); toast('Silindi');
}

/* ================= RAPOR ================= */
let rOrder='', lastCanvas=null;
function renderRep(){
  const l=act(); if(!l.find(o=>o.id===rOrder)) rOrder=l.length===1?l[0].id:'';
  $('rOrder').innerHTML=`<option value="">— Sipariş seçin —</option>`+l.map(o=>`<option value="${o.id}">${esc(oLabel(o))}${prodsText(o)?' – '+esc(prodsText(o)):''}</option>`).join('');
  $('rOrder').value=rOrder;
  if(page!=='rep') return;
  if(!rOrder){ $('repPreview').style.display='none'; $('shareBtn').style.display='none'; lastCanvas=null; return; }
  lastCanvas=drawReport(orderById(rOrder));
  $('repPreview').src=lastCanvas.toDataURL('image/png'); $('repPreview').style.display='block'; $('shareBtn').style.display='block';
}
$('rOrder').onchange=e=>{ rOrder=e.target.value; renderRep(); };

function drawReport(o){
  const W=1080,P=56,tw=W-2*P, FONT='system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif';
  const T=calcOrder(o.id,false), G=groupsOf(o), multi=G.length>1, rows=G.flatMap(([p,cs])=>(multi?[[null,p,cs]]:[]).concat(cs.map(c=>[c,calcColor(o.id,c.id)])));
  const moves=S.moves.filter(m=>m.orderId===o.id);
  const days=t=>{ const g={}; moves.filter(m=>m.type===t).forEach(m=>{ (g[m.date]=g[m.date]||{}); g[m.date][m.colorId]=(g[m.date][m.colorId]||0)+m.qty; });
    return Object.keys(g).sort((a,b)=>b.localeCompare(a)).map(d=>[d,o.colors.filter(c=>g[d][c.id]).map(c=>[c,g[d][c.id]])]); };
  const dS=days('S'), dP=days('P');
  const cv=document.createElement('canvas'); cv.width=W; cv.height=1400+rows.length*96+(dS.length+dP.length)*150; const x=cv.getContext('2d');
  const font=(s,w=400)=>x.font=`${w} ${s}px ${FONT}`;
  const fit=(s,max)=>{ s=String(s); if(x.measureText(s).width<=max) return s; while(s.length&&x.measureText(s+'…').width>max) s=s.slice(0,-1); return s+'…'; };
  const text=(s,px,py,{size=28,wt=400,col='#1f2324',align='left',max}={})=>{ font(size,wt); x.fillStyle=col; x.textBaseline='middle'; x.textAlign=align; if(max) s=fit(s,max); x.fillText(s,px,py); return x.measureText(s).width; };
  const rect=(px,py,w,h,col,r=16)=>{ x.fillStyle=col; x.beginPath(); x.roundRect?x.roundRect(px,py,w,h,r):x.rect(px,py,w,h); x.fill(); };
  const dot=(cx,cy,r,hex)=>{ x.fillStyle=hex; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=2; x.stroke(); };
  const PREP='#2f6fb3', SHIP='#2e8b57', WARN='#c26a12', MUTE='#6e7476';

  x.fillStyle='#f3f2ef'; x.fillRect(0,0,W,cv.height);
  x.fillStyle='#0f3b40'; x.fillRect(0,0,W,250);
  text('Üretim Raporu',P,50,{size:27,wt:600,col:'#a9cfd2'});
  text(o.customer,P,108,{size:50,wt:800,col:'#fff',max:tw});
  text([o.no?'Sipariş #'+o.no:'',prodsText(o)].filter(Boolean).join('  ·  ')||' ',P,166,{size:29,wt:600,col:'#d7ecee',max:tw});
  text('Sipariş tarihi: '+fmtD(o.date)+'   ·   Oluşturulma: '+fmtTs(Date.now()),P,212,{size:21,col:'#a9cfd2',max:tw});
  let y=284;

  /* Özet kutuları */
  const tiles=[['Sipariş',T.q,'#1f2324'],['Hazırlanan',T.r,PREP],['Sevk edilen',T.s,SHIP],['Depoda',T.dep,PREP],T.fz&&!T.kal?['Fazla','+'+T.fz,WARN]:['Kalan',T.kal,MUTE]];
  const g=14, tW=(tw-4*g)/5;
  tiles.forEach(([l,v,c],i)=>{ const bx=P+i*(tW+g); rect(bx,y,tW,140,'#fff'); rect(bx,y,tW,8,c,4);
    text(String(v),bx+tW/2,y+62,{size:46,wt:800,col:c,align:'center'}); text(l,bx+tW/2,y+112,{size:20,wt:600,col:MUTE,align:'center',max:tW-10}); });
  y+=160;
  rect(P,y,tw,64,'#fff');
  text('%'+pct(T.rc,T.q)+' hazırlandı',P+26,y+32,{size:26,wt:800,col:PREP});
  text('%'+pct(Math.min(T.s,T.q),T.q)+' sevk edildi',W-P-26,y+32,{size:26,wt:800,col:SHIP,align:'right'});
  y+=100;

  /* Renk tablosu */
  text(multi?'Ürün ve renklere göre durum':'Renklere göre durum',P,y,{size:30,wt:800}); y+=40;
  const cols=[['Sipariş','q','#1f2324'],['Hazır','r',PREP],['Sevk','s',SHIP],['Depoda','dep',PREP],['Kalan','kal',MUTE]], cw=104, c0=W-P-cw*cols.length-12;
  cols.forEach(([l,,c],i)=>text(l,c0+i*cw+cw/2,y+16,{size:19,wt:700,col:c,align:'center'}));
  y+=40; const RH=96;
  const HH=64; rect(P,y,tw,rows.reduce((a,r)=>a+(r[0]?RH:HH),0)+12,'#fff'); y+=6;
  rows.forEach(([c,v,cs],i)=>{
    if(!c){ rect(P+12,y+8,tw-24,HH-14,'#eef3f3',10); let q=0,r=0,s2=0; cs.forEach(k=>{const z=calcColor(o.id,k.id);q+=z.q;r+=z.r;s2+=z.s;});
      text('📦 '+v,P+30,y+HH/2+1,{size:25,wt:800,col:'#0f3b40',max:tw-380}); text(`Hazır ${r}/${q}  ·  Sevk ${s2}`,W-P-30,y+HH/2+1,{size:21,wt:700,col:MUTE,align:'right'}); y+=HH; return; }
    if(i&&rows[i-1][0]){ x.fillStyle='#ecebe7'; x.fillRect(P+20,y,tw-40,2); }
    dot(P+40,y+36,16,c.hex);
    text(c.name+(v.s>=v.q?'  🚚':v.r>=v.q?'  ✓':''),P+70,y+36,{size:26,wt:700,max:c0-P-90});
    const bx=P+24,bw=c0-P-48,base=Math.max(v.q,v.r)||1; rect(bx,y+66,bw,12,'#ecebe7',6);
    if(v.s) rect(bx,y+66,bw*v.s/base,12,SHIP,6); if(v.dep) { x.fillStyle=PREP; x.fillRect(bx+bw*v.s/base,y+66,bw*v.dep/base,12); }
    cols.forEach(([,k,cc],j)=>{ let val=v[k], col=cc; if(k==='kal'&&v.fz){ val='+'+v.fz; col=WARN; } text(String(val),c0+j*cw+cw/2,y+RH/2,{size:28,wt:800,col,align:'center'}); });
    y+=RH; });
  y+=50;

  /* Günlere göre liste */
  const dayBlock=(title,list,col,sign)=>{
    text(title,P,y,{size:30,wt:800}); y+=34;
    if(!list.length){ rect(P,y,tw,70,'#fff'); text('Henüz kayıt yok',W/2,y+35,{size:22,col:MUTE,align:'center'}); y+=110; return; }
    list.forEach(([d,items])=>{
      font(23,600); let lines=1, lx=P+190; items.forEach(([c,q])=>{ const w=46+x.measureText(cLabel(o,c)+' '+sign+q).width+26; if(lx+w>W-P-20){ lines++; lx=P+190; } lx+=w; });
      const h=Math.max(100,26+lines*46); rect(P,y,tw,h,'#fff'); const tot=items.reduce((a,[,q])=>a+q,0);
      text(fmtD(d),P+22,y+36,{size:23,wt:800}); text(sign+tot+' çuval',P+22,y+68,{size:19,wt:700,col});
      lx=P+190; let ly=y+36;
      items.forEach(([c,q])=>{ font(23,600); const nm=cLabel(o,c), lbl=nm+' '+sign+q, w=46+x.measureText(lbl).width+26; if(lx+w>W-P-20){ lx=P+190; ly+=46; }
        dot(lx+14,ly,12,c.hex); text(nm,lx+34,ly,{size:23,wt:600}); font(23,600); text(' '+sign+q,lx+34+x.measureText(nm).width,ly,{size:23,wt:800,col}); lx+=w; });
      y+=h+10; });
    y+=36; };
  dayBlock('Sevkiyatlar',dS,SHIP,'');
  dayBlock('Hazırlık (günlere göre)',dP,PREP,'+');
  text('Üretim Takip · Hazırlık ve sevkiyat',W/2,y,{size:20,col:'#a0a6a8',align:'center'});
  const out=document.createElement('canvas'); out.width=W; out.height=y+40; out.getContext('2d').drawImage(cv,0,0); return out;
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
$('shareBtn').onclick=()=>{ if(!lastCanvas) return; const o=orderById(rOrder);
  const name='uretim-'+(o.customer+'-'+(o.no||'')).replace(/[^\p{L}\p{N}]+/gu,'-')+'-'+today()+'.png';
  lastCanvas.toBlob(async b=>{ const f=new File([b],name,{type:'image/png'});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Üretim Raporu – '+oLabel(o)}); return; } }catch(e){ if(e.name==='AbortError') return; }
    download(b,name); },'image/png'); };

/* ================= GENEL ================= */
function renderAll(){ purgeDue(); renderTur(); renderOrders(); renderHist(); renderRep(); renderBk(); renderBkBanner(); }
renderAll();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script type="module">
/* ============ FIREBASE (Astar Takip ile aynı proje) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBC9lfCW6qPNOjcQDLQ25gTakR7STfWFCg",
  authDomain: "astar-takibi.firebaseapp.com",
  projectId: "astar-takibi",
  storageBucket: "astar-takibi.firebasestorage.app",
  messagingSenderId: "166821220605",
  appId: "1:166821220605:web:2aee28534e8774c1856e94"
};
const $ = id => document.getElementById(id);
function setSync(st){ const c=$('syncChip'); c.style.display='inline-block'; c.className='sync '+st;
  c.textContent={ok:'☁ Kaydedildi',pending:'⏳ Gönderiliyor',offline:'📴 Çevrimdışı',err:'⚠ Bulut hatası',wait:'… Bağlanıyor'}[st]; }
const localMode = new URLSearchParams(location.search).has('yerel');

if(firebaseConfig.apiKey && !localMode){
  setSync('wait');
  try{
    const B='https://www.gstatic.com/firebasejs/13.4.0/';
    const { initializeApp } = await import(B+'firebase-app.js');
    const A = await import(B+'firebase-auth.js');
    const F = await import(B+'firebase-firestore.js');
    const app = initializeApp(firebaseConfig);
    const auth = A.getAuth(app);
    const db = F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
    const COLL={orders:'u_orders',moves:'u_moves',meta:'u_meta'};
    let uid=null, unsubs=[];
    const cache={orders:{},moves:{},meta:null}, first={}, pend={};
    const clean=o=>JSON.parse(JSON.stringify(o));
    window.Cloud={on:true,ready:false,write(ops){
      if(!uid) return;
      for(let i=0;i<ops.length;i+=400){ const b=F.writeBatch(db);
        ops.slice(i,i+400).forEach(([op,coll,v])=>{ const id=coll==='meta'?'main':(op==='put'?v.id:v), r=F.doc(db,'users',uid,COLL[coll],id);
          op==='put'?b.set(r,clean(v)):b.delete(r); });
        b.commit().catch(e=>{console.error(e);setSync('err');}); }
      setSync(navigator.onLine?'pending':'offline');
    }};
    let fromCache=true;
    function status(){ const p=Object.values(pend).some(Boolean); setSync(p?(navigator.onLine?'pending':'offline'):(fromCache&&!navigator.onLine?'offline':'ok')); }
    function onSnap(kind,meta){
      first[kind]=true; pend[kind]=meta.hasPendingWrites; fromCache=meta.fromCache;
      if(!(first.orders&&first.moves&&first.meta)) return;
      window.Cloud.ready=true;
      setRemote({orders:Object.values(cache.orders),moves:Object.values(cache.moves),meta:cache.meta||{colors:[]}});
      status();
    }
    function listen(){
      const err=e=>{console.error(e);setSync('err');};
      unsubs.push(F.onSnapshot(F.collection(db,'users',uid,COLL.orders),{includeMetadataChanges:true},sn=>{cache.orders={};sn.forEach(d=>cache.orders[d.id]=d.data());onSnap('orders',sn.metadata);},err));
      unsubs.push(F.onSnapshot(F.collection(db,'users',uid,COLL.moves),{includeMetadataChanges:true},sn=>{cache.moves={};sn.forEach(d=>cache.moves[d.id]=d.data());onSnap('moves',sn.metadata);},err));
      unsubs.push(F.onSnapshot(F.doc(db,'users',uid,COLL.meta,'main'),{includeMetadataChanges:true},d=>{cache.meta=d.exists()?d.data():null;onSnap('meta',d.metadata);},err));
    }
    window.addEventListener('online',status); window.addEventListener('offline',status);
    A.onAuthStateChanged(auth,user=>{
      unsubs.forEach(u=>u()); unsubs=[]; window.Cloud.ready=false; for(const k in first) delete first[k];
      if(user){ uid=user.uid; $('loginBox').style.display='none'; $('acctLine').innerHTML='☁ Bulut hesabı: <b>'+(user.email||'')+'</b>'; $('logoutBtn').style.display='block'; listen(); }
      else{ uid=null; $('loginBox').style.display='flex'; $('logoutBtn').style.display='none'; setSync('offline'); }
    });
    $('lgBtn').onclick=async()=>{ $('lgErr').textContent=''; $('lgBtn').disabled=true;
      try{ await A.signInWithEmailAndPassword(auth,$('lgEmail').value.trim(),$('lgPass').value); }
      catch(e){ $('lgErr').textContent=navigator.onLine?'E-posta veya şifre hatalı.':'İnternet bağlantısı yok.'; }
      $('lgBtn').disabled=false; };
    $('logoutBtn').onclick=async()=>{ if(!await window.ask('Çıkış yapılsın mı? Veriler bulutta kalır.')) return; await A.signOut(auth); setRemote({orders:[],moves:[],meta:{colors:[]}}); };
  }catch(e){ console.error(e); setSync('err'); }
}
